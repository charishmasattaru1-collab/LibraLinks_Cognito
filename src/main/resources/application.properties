server.port=8080
google.api.key=
spring.mvc.static-path-pattern=/**

# New configuration for Amazon Cognito and Spring Security
spring.security.oauth2.client.registration.cognito.client-id=
spring.security.oauth2.client.registration.cognito.client-secret=

# IMPORTANT: Ensure these scopes are enabled in your Cognito App Client settings.
# App integration > App clients > [Your app client] > OAuth 2.0 grant types
spring.security.oauth2.client.registration.cognito.scope=openid,email,phone,profile
spring.security.oauth2.client.registration.cognito.redirect-uri=http://localhost:8080/login/oauth2/code/cognito
spring.security.oauth2.client.provider.cognito.issuer-uri=
spring.security.oauth2.client.provider.cognito.user-name-attribute=username

# Cognito custom logout configuration
aws.cognito.domain=
aws.cognito.client-id=
aws.cognito.logout-redirect-url=http://localhost:8080/

# Thymeleaf configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

