<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Library Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white rounded-lg shadow-xl p-8 max-w-lg w-full text-center">
    <div sec:authorize="isAuthenticated()">
        <h1 class="text-3xl font-bold text-gray-800 mb-4">Welcome Back!</h1>
        <p class="text-gray-600 mb-6">You are logged in as <strong th:text="${#authentication.name}"></strong>.</p>
        <div class="space-y-4">
            <a href="/find-libraries" class="inline-block w-full px-6 py-3 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition duration-300">
                Go to Library Finder
            </a>
            <form th:action="@{/logout}" method="post" class="w-full">
                <button type="submit" class="w-full px-6 py-3 bg-red-500 text-white rounded-lg font-semibold hover:bg-red-600 transition duration-300">
                    Log out
                </button>
            </form>
        </div>
    </div>

    <div sec:authorize="isAnonymous()">
        <h1 class="text-3xl font-bold text-gray-800 mb-4">Welcome to Library Finder</h1>
        <p class="text-gray-600 mb-6">Please log in to find libraries near you.</p>
        <div class="space-y-4">
            <a th:href="@{/oauth2/authorization/cognito}" class="inline-block w-full px-6 py-3 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 transition duration-300">
                Log in with Cognito
            </a>
        </div>
    </div>
</div>

</body>
</html>
